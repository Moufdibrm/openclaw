    source: docs/ops/agent-governance/TONY_LOG_BUG_AUDIT.md
    title: stale_brmxhermes_review_paths_block_plan_dev
  - id: TONY-002
    source: docs/ops/agent-governance/TONY_LOG_BUG_AUDIT.md
    title: codebase_exploration_input_contract_drift
  - id: TONY-003
    source: docs/ops/agent-governance/TONY_LOG_BUG_AUDIT.md
    title: runtime_wrapper_tests_depend_on_pythonpath
