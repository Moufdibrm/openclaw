    severity: "p0"
    status: "resolved_local_2026-05-07"
    evidence: "/Users/moufdi/.openclaw/knowledge-graph/repair-20260506T232721Z/validate-openclaw-combined-after.json"
    required_resolution: "supervised live commit replay still required before prod memory writes"
  - id: "source_of_truth_split"
    severity: "p0"
    status: "mitigated_content_aligned"
