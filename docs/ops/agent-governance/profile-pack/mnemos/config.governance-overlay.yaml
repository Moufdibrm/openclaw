---
agent: mnemos
last_updated: '2026-05-07'
apply_mode: merge_overlay_not_full_config_replace
platform_toolsets:
  cli:
  - hermes-cli
governance_policy:
  standard: brm.agent-profile.v1
  last_updated: '2026-05-07'
  source_docs_root: "docs/ops/agent-governance"
  source_matrices:
    toolbox: "docs/ops/agent-governance/agent-toolbox-matrix.yaml"
    environment: "docs/ops/agent-governance/agent-environment-matrix.yaml"
    protocol: "docs/ops/agent-governance/agent-protocol-matrix.yaml"
    platform_access: "docs/ops/agent-governance/agent-platform-access-matrix.yaml"
  profile_sidecars:
    role_permissions_md: ROLE_PERMISSIONS.md
    role_permissions_json: ROLE_PERMISSIONS.json
    environment_map: ENVIRONMENT_MAP.md
    route_matrix: ROUTE_MATRIX.md
    procedures: PROCEDURES.md
  access_projection:
    agent_key: mnemos
    visible_platforms: 1
    read_allowed_platforms: 1
    write_conditional_platforms: 1
  route_before_tool: true
  script_first: true
  proof_before_done: true
  read_write_split: true
  installed_skill_is_permission: false
  external_write_policy: route_or_explicit_approval_required
