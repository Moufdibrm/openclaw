version: 1
last_updated: "2026-05-06"
purpose: "Map workflow contract inputs to runtime runner args or mark workflows as package-only/planned for dry-run testing."
scope: "governance_mapping_only_no_runtime_changes"

mapping_status_values:
  exact_runtime_route: "Contract inputs match a specialist-route-registry runner closely enough for post-deploy smoke testing."
  partial_runtime_route: "Runtime route exists but defaults/optional inputs or proof criteria need tightening."
  package_only: "Protocol package exists, but no specialist-route-registry runner entry was observed."
  planned_only: "Workflow is planned/draft; test as dry-run or blocked render only."
  local_helper: "Workflow uses a local governed helper outside specialist-route-registry."
  blocked_until_approval: "Do not execute until approval/consent prerequisites exist."

safe_defaults:
  upload_drive: false
  days: 7
  case_limit: 3
  ticket_limit: 5
  skip_comments: true
  snapshot_repo: true
  write_cursor: false
  kg_commit: false
  mission_manager_mutation: false

