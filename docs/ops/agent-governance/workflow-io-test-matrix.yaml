version: 1
last_updated: "2026-05-06"
purpose: "Input/output and post-deployment test expectations for governed BRM/Hermes workflows."
scope: "governance_test_contracts_only_no_runtime_deploy"

standard_render_to_moufdi:
  required_fields:
    - workflow_id
    - status
    - brand_scope_when_brand_linked
    - input_summary
    - output_artifacts
    - proof_artifacts
    - approval_gates
    - gaps_or_next_fix
  conditional_required_fields:
    brand_scope:
      when: "workflow input, output, proof, or deliverable is tied to a brand"
      source_contract: "/Users/moufdi/openclaw/docs/ops/agent-governance/brand-scope-contract.yaml"
  statuses:
    - passed
    - passed_with_warnings
    - failed
    - blocked

brand_linked_deliverable_rule:
  required: true
  contract: "/Users/moufdi/openclaw/docs/ops/agent-governance/brand-scope-contract.yaml"
  applies_to:
    - runner_input
    - manifest_json
    - result_json
    - report_data_json
    - delivery_json
    - verification_json
    - approval_packet
    - generated_media_manifest
    - campaign_brief
    - workboard
    - handoff_packet
    - memory_candidate
  validation_gap_if_missing: true

global_approval_gates:
  - outbound_external_message
  - customer_visible_support_reply
  - paypal_or_dispute_message
  - refund_payment_billing_or_financial_mutation
  - campaign_publication_or_paid_delivery_mutation
  - ambiguous_target_or_delta
  - identity_or_private_media_use

workflows:
  - id: jack.protocol-missing
    agent: jack
    status: beta
    inputs_required: [request_text, target_agent]
    inputs_optional: [source_channel, reason_code, mentioned_agents, upload_drive]
    outputs_expected: [compact_json, protocol_candidate_bundle, final_summary]
    proof_required: [compact_json, candidate_path]
    render_to_moufdi: "candidate path, target agent, missing route reason, next decision"
    post_deploy_test: "Submit a specialist request with no matching route and confirm a reviewable protocol candidate is produced."
  - id: jack.capability-missing
    agent: jack
    status: beta
    inputs_required: [request_text, capability_slug]
    inputs_optional: [capability_label, coverage_hint, suggested_agents, framework_layers]
    outputs_expected: [compact_json, coverage_matrix, protocol_bundle_candidate]
    proof_required: [compact_json, coverage_matrix_path]
    render_to_moufdi: "capability gap, suggested owner, proposed next workflow"
    post_deploy_test: "Submit a capability design ask and confirm Jack produces a matrix instead of executing ad hoc work."
  - id: jack.draft-protocol-runtime
    agent: jack
    status: beta
    inputs_required: [bundle_path, draft_mode]
    inputs_optional: [prompt]
    outputs_expected: [compact_json, verification_report]
    proof_required: [bundle_path, verification_report]
    render_to_moufdi: "draft lifecycle status, verification path, blocker"
    post_deploy_test: "Run a safe draft bundle through observe/confirm mode and verify no governed registry mutation."
  - id: jack.direct.mm-supervision
    agent: jack
    status: beta
    registry_coverage: package_only
    inputs_required: [mission_context, intended_change]
    inputs_optional: [current_mm_state]
    outputs_expected: [decision_json, mission_patch, final_summary]
    proof_required: [decision_json, mission_patch]
    render_to_moufdi: "proposed Mission Manager patch only; no hidden mutation"
    approval_gates: [mission_manager_mutation]
    post_deploy_test: "Use a fixture mission and verify patch generation without applying it."
  - id: jack.email-digest
