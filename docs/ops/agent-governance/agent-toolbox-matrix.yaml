status_values:
  - draft
  - beta
  - prod

autonomy_levels:
  audit_read:
    description: "Read, inspect, summarize, compare, and report."
    may_mutate_external: false
  discussion_approval:
    description: "Discuss, plan, draft, and prepare action. Ask before real external or business mutation."
    may_mutate_external: false
  autonomous_e2e_validated_route:
    description: "Execute end-to-end only on an already validated route, using the route tool allowlist and proof contract."
    may_mutate_external: "only_if_route_allows_and_global_approval_gates_pass"

global_approval_required:
  - outbound_external_message
  - customer_visible_support_reply
  - paypal_or_dispute_message
  - refund_payment_billing_or_financial_mutation
  - ambiguous_target_or_delta

central_skill_policy:
  install_strategy: centralized_skills
  enforcement_strategy: agent_route_allowlist
  note: "The same broad skill tree is currently installed in every Hermes profile. Permission must come from this matrix and route packages, not from skill presence."
  common_denied_skill_families_unless_explicit_route:
    - red-teaming
    - smart-home
    - gaming
    - leisure
    - social-media-posting
    - unrelated-apple-personal-tools
    - devops-deploy
    - payment-mutation
    - external-message-send

agents:
  jack:
    status: beta
    role: "Transversal operator, route resolver, direct executor when governed."
    approved_autonomy:
      - audit_read
      - discussion_approval
      - autonomous_e2e_validated_route
    allowed_skill_families:
