version: 1
last_updated: "2026-05-07"
scope: "BRM/Hermes governed platform and surface registry"
status_values:
  - draft
  - beta
  - prod
  - partial
  - legacy
  - deferred
  - unclear
category_values:
  - commerce
  - crm_email
  - support
  - payment
  - logistics
  - supply_chain
  - paid_media
  - analytics
  - visibility
  - creator_social
  - channel
  - collaboration
  - delivery
  - creative_ai
  - model_provider
  - internal_control
  - memory
  - development
  - infra
  - edge_domain
  - secrets
scope_values:
  - global
  - brand_scoped
  - account_scoped
  - tenant_scoped
  - channel_scoped
  - repo_scoped
  - file_scoped
  - profile_scoped
global_rules:
  jack_access: "transversal_read_supervision_gap_detection_and_governed_direct_execution_when_requested"
  jack_mutation: "no_blanket_mutation_rights"
  installed_skill_is_permission: false
  direct_read_policy: "allowed only when owned, bounded, unambiguous, and logged"
  repeated_direct_use_policy: "create protocol_candidate or toolbox_gap"
  external_write_policy: "route_or_explicit_approval_required"
  secret_policy: "record env key names or secret source only; never record secret values"
  brand_partial_policy: "missing brand surface blocks only that surface"
approval_gates:
  - outbound_external_message
  - customer_visible_support_reply
  - paypal_or_dispute_message
  - refund_payment_billing_financial_mutation
  - campaign_publication_or_ad_mutation
  - supplier_order_purchase_mutation
  - crm_send_flow_segment_mutation
  - storefront_theme_site_publication
  - drive_upload_or_external_delivery
  - infra_dns_secret_deploy_restart_mutation
  - ambiguous_target_tenant_brand_or_delta
addition_standard:
  create_as_status: draft
  required_fields:
    - platform_id
    - display_name
    - category
    - status
    - scope_model
    - primary_owner_agent
    - supervisor_agent
    - read_surfaces
    - write_surfaces
    - approval_gated_surfaces
    - forbidden_surfaces
    - auth
    - skills_or_toolboxes
    - direct_tool_use_policy
    - protocol_policy
    - proof_targets
    - test_plan
    - open_questions
  promotion:
    draft_to_beta:
      - registry_entry_complete
      - owner_agent_assigned
      - read_write_split_clear
      - auth_presence_checked_without_secret_leak
      - first_bounded_read_or_fixture_test
      - proof_target_documented
    beta_to_prod:
      - repeated_successful_bounded_runs
      - protocol_exists_for_repeated_workflow
      - pre_post_readback_or_no_mutation_proof
      - retry_or_failure_behavior_documented
      - approval_gate_tested_when_relevant
      - brand_scope_verified_when_brand_linked
      - curator_feedback_path_defined

platforms:
  shopify:
    platform_id: shopify
    display_name: Shopify
    category: commerce
    status: partial
    maturity_note: "First commerce slice is standardized; broader store/theme/mutation coverage remains partial."
    scope_model: [brand_scoped, tenant_scoped, account_scoped]
    primary_owner_agent: rosa
    secondary_owner_agents: [naya, alfred, tony]
    supervisor_agent: jack
    brand_scoped: true
    brand_pack_fields:
      - ecosystem.shopify.store_key
      - ecosystem.shopify.myshopify_domain
      - ecosystem.shopify.api_version
      - ecosystem.shopify.known_tenants
      - critical_routes.shopify
    read_surfaces:
      - products
      - orders
      - inventory
      - discounts
      - collections
      - theme_read
      - storefront_verify
    write_surfaces:
      - product_update
      - collection_update
      - discount_update
      - theme_update
      - storefront_publication
    approval_gated_surfaces:
      - product_or_theme_publication
      - storefront_mutation
      - customer_or_order_mutation
    forbidden_surfaces:
      - hidden_store_mutation
      - mutation_without_brand_tenant_resolution
    auth:
      required: true
      secret_source: "shared Hermes/business env or AWS-synced secret metadata"
      env_keys: [SHOPIFY_TOKEN_BY_BRAND]
      secret_values_in_docs_allowed: false
    skills_or_toolboxes:
      - shopify-read
      - shopify-admin-graphql
      - storefront-verification
    direct_tool_use_policy:
      read: "allowed for Rosa/Naya/Alfred/Tony only when brand and tenant are explicit"
      write: "route_or_explicit_approval_required"
    protocol_policy:
      required_for_repeated_use: true
      required_for_external_mutation: true
      current_routes: [naya.stock-check, rosa.audit-performance-marketing]
    proof_targets: [json_readback, report_bundle, no_mutation_statement, pre_post_readback_for_mutation]
    test_plan:
      fixture_test: "brand-scoped product/order/inventory fixture"
      live_read_test: "bounded read against one declared store"
      mutation_gate_test: "attempted mutation must block without approval"
    open_questions:
      - "Which Shopify write routes should be promoted first: product updates, theme/content, discounts, or storefront publication?"

