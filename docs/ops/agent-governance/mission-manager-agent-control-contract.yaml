version: 1
last_updated: '2026-05-07'
standard_id: brm.mm-agent-control-contract.v1
scope:
  v1_agents:
  - jack
  - jack-x
  - mnemos
  - rosa
  - jeff
  - naya
  - selena
  - alfred
  - cortex
  - tony
  - kanye
  - safir
  out_of_scope:
  - runtime_gateway_wiring
  - deploy
  - restart
  - systemd
  - mission_manager_implementation
  - vps_release_control
source_of_truth:
  toolbox_matrix: docs/ops/agent-governance/agent-toolbox-matrix.yaml
  environment_matrix: docs/ops/agent-governance/agent-environment-matrix.yaml
  protocol_matrix: docs/ops/agent-governance/agent-protocol-matrix.yaml
  platform_access_matrix: docs/ops/agent-governance/agent-platform-access-matrix.yaml
  profile_materialization_manifest: docs/ops/agent-governance/agent-profile-materialization-manifest.yaml
global_rules:
  installed_skill_is_permission: false
  status_values:
  - draft
  - beta
  - prod
  jack_visibility: all_platforms_for_supervision_routing_gap_detection_and_governed_direct_execution
  jack_mutation: no_blanket_mutation_route_or_explicit_approval_required
  tony_partial_visibility: development_audit_context_only_not_business_permission
  specialist_visibility: owned_secondary_route_owned_or_explicit_access_only
  missing_route_behavior: jack.protocol-missing
  missing_capability_behavior: jack.capability-missing
control_levels:
  view_governance:
    may_mutate_external: false
    description: Display scope, tools, platforms, routes, proofs, and profile health.
  request_audit_read:
    may_mutate_external: false
    description: Create a read/audit task for an agent.
  request_discussion_approval:
    may_mutate_external: false
    description: Prepare an action or ask for approval before execution.
  launch_validated_route:
    may_mutate_external: only_if_route_allows_and_gates_pass
    description: Launch an existing route with its proof contract.
  record_approval_decision:
    may_mutate_external: false
    description: Record approve/reject decision for gated action.
  request_governance_change:
    may_mutate_external: false
    description: Ask governance lane to update permissions/toolbox/protocol docs.
approval_required_for:
- outbound_external_message
- customer_visible_support_reply
- paypal_or_dispute_message
- refund_payment_billing_or_financial_mutation
- ambiguous_target_or_delta
- external_publication
- paid_delivery_platform_mutation
- voice_clone_without_consent
- external_audio_send
action_request_schema:
  required:
  - mission_id
  - task_id
  - requested_by
  - agent_id
  - autonomy_level
  - read_or_write
  - external_mutation
  - proof_targets
  optional:
  - route_id
  - platform_id
  - brand_scope
  - approval_gate_refs
  - input_artifacts
  - expected_outputs
  - blocked_reason
  - profile_materialization_ref
