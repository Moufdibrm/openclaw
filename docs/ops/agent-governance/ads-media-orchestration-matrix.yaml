slices:
  - id: ads-media.t0.fixture-base
    status: prod
    lead_agent: jack
    mode: governance_inventory_only
    inputs_required: [brand_scope]
    outputs_expected: [fixture_paths, hashes, blockers]
    proof_required:
      - ads-media-orchestration-matrix.yaml
      - ads-media-test-ledger.yaml
    hard_blocks: []

  - id: ads-media.t1.cortex-observation
    status: prod
    lead_agent: cortex
    mode: read_only
    source_workflow: cortex.ads-observation
    inputs_required: [brand_scope]
    inputs_optional: [upload_drive]
    safe_defaults:
      upload_drive: false
    outputs_expected:
      - ads_observation_report
      - ads_observation_report_data
      - verification_json
      - delivery_json
    proof_required:
      - report_bundle
      - verification_json
    hard_blocks:
      - campaign_mutation
      - ad_publication

  - id: ads-media.t2.cortex-creative-brief
    status: beta
    lead_agent: cortex
    mode: dry_run_only
    source_workflow: cortex.campaign-management
    inputs_required:
      - brand_scope
      - campaign_objective
      - campaign_management_report_data
    inputs_optional:
      - rosa_offer_context
      - naya_stock_context
      - alfred_landing_context
    outputs_expected:
      - creative_briefs_json
      - kanye_asset_request_json
    proof_required:
      - creative_briefs_json
      - source_report_data
    next_gap: "Normalize kanye_asset_request_json from existing creative-briefs.json."
    hard_blocks:
      - campaign_mutation
      - ad_publication

  - id: ads-media.t3.cortex-to-kanye-asset-request
    status: beta
    lead_agent: cortex
    creative_agent: kanye
    mode: handoff_contract
    inputs_required:
      - creative_briefs_json
      - product_or_offer
      - source_assets
      - brand_constraints
    outputs_expected:
      - accepted_asset_request
      - missing_fields_if_rejected
    proof_required:
      - kanye_asset_request_json
    hard_blocks:
      - direct_higgsfield_by_cortex
      - campaign_mutation
      - ad_publication

  - id: ads-media.t4.kanye-asset-generation
    status: beta
    lead_agent: kanye
    mode: local_media_generation
    allowed_workflows:
      - kanye.still-generate
      - kanye.reference-edit
      - kanye.higgsfield-generate.official-cli
      - kanye.higgsfield-product-photoshoot.validation
    draft_workflows:
      - kanye.higgsfield-marketplace-cards.validation
      - kanye.higgsfield-soul-id.validation
    inputs_required:
      - accepted_asset_request
      - source_assets
      - generation_route
    outputs_expected:
      - generated_media
      - media_manifest
      - attachment_provenance
      - generation_caveats
    proof_required:
      - manifest
      - local_media_file
      - attachment_metadata
    hard_blocks:
      - external_publication
      - paid_delivery_mutation
      - campaign_mutation
      - ad_publication
      - identity_or_private_media_use

  - id: ads-media.t5.cortex-media-qa
    status: beta
    lead_agent: cortex
    mode: internal_review
    inputs_required:
      - creative_briefs_json
      - media_manifest
      - generated_media
      - brand_constraints
    outputs_expected:
      - creative_qa_report
      - selected_asset_refs
      - rejected_asset_refs
      - iteration_requests
    checks:
      - brief_match
      - brand_fit
      - product_accuracy
      - offer_claim_safety
      - dimensions_and_ratios
      - source_provenance
      - no_external_publication
    hard_blocks:
      - campaign_mutation
      - ad_publication

  - id: ads-media.t6.cortex-campaign-dry-run
    status: beta
    lead_agent: cortex
    mode: dry_run_only
    source_workflow: cortex.campaign-management
    inputs_required:
      - creative_qa_report
      - selected_asset_refs
      - campaign_objective
      - budget_scope
    outputs_expected:
      - campaign_dry_run_json
      - ads_task_board_json
      - approval_request
    proof_required:
      - campaign_dry_run
      - explicit_hard_blocks
    hard_blocks:
      - campaign_mutation
      - ad_publication
      - paid_delivery_mutation

  - id: ads-media.t7.approval-packet
    status: beta
    lead_agent: jack
    mode: approval_request_only
    inputs_required:
      - campaign_dry_run_json
      - selected_asset_refs
      - media_manifest
      - platform_targets
      - requested_mutations
    outputs_expected:
      - approval_packet
      - resolved_gate_list
      - post_mutation_readback_plan
    hard_blocks:
      - live_execution_without_explicit_approval

  - id: ads-media.t8.live-publication
    status: blocked
    lead_agent: "operator_or_integrator_lane"
    mode: out_of_scope_until_explicit_approval
    inputs_required:
      - explicit_moufdi_approval
      - platform_targets
      - campaign_or_ad_ids
      - readback_plan
    outputs_expected:
      - post_mutation_readback
    hard_blocks:
      - no_explicit_approval
      - ambiguous_target_or_delta

  - id: ads-media.t9.feedback-loop
    status: draft
    lead_agent: cortex
    mode: after_live_publication_only
    source_workflow: cortex.feedback-loop
    inputs_required:
      - post_publication_metrics
      - approved_media_manifest
      - campaign_readback
    outputs_expected:
      - feedback_report
      - next_cycle_input
    hard_blocks:
      - missing_live_publication_readback
