version: 1
last_updated: "2026-05-06"
purpose: "Machine-readable orchestration contract for ads/media slices across Cortex and Kanye."
scope: "governance_only_no_runtime_mutation"

status_values:
  - draft
  - beta
  - prod
  - blocked

approval_gates:
  campaign_mutation:
    meaning: "Any live campaign/ad/adset creation, edit, pause, budget, targeting, or platform write."
    required_before_live: true
  ad_publication:
    meaning: "Any action that publishes, schedules, or activates an ad on a paid media platform."
    required_before_live: true
  external_publication:
    meaning: "Any public distribution of generated creative outside local proof artifacts."
    required_before_live: true
  paid_delivery_mutation:
    meaning: "Any paid delivery, boost, spend, or distribution mutation."
    required_before_live: true
  identity_or_private_media_use:
    meaning: "Any use of identity/private media, likeness, Soul ID, or non-public personal assets."
    required_before_live: true

artifact_layout:
  planned_cortex_orchestration_run_layout: "workspace-cortex/ads-media-orchestration/<run_id>/"
  cortex_reports_root: /Users/moufdi/.openclaw/workspace-cortex/reports
  kanye_workspace_root: /Users/moufdi/.openclaw/workspace-kanye
  kanye_generated_media_root: /Users/moufdi/.brm-hermes/profiles/kanye/generated_media
  required_manifest: manifest.json
  note: "Cortex owns orchestration/report artifacts. Kanye owns generated media artifacts."

agents:
  cortex:
    role: "Lead ads strategist and media QA owner."
    allowed_toolboxes:
      - hiboo-ads-read
      - meta-ads-read
      - google-ads-read
      - creative-observation
      - creative-asset-request-via-kanye
      - filesystem-reporting
    forbidden_direct_tools:
      - direct-higgsfield-generation
      - live-campaign-write-without-approval
      - ad-publication-without-approval
    outputs_owned:
      - ads_observation_report
      - creative_briefs_json
      - asset_request_json
      - creative_qa_report
      - campaign_dry_run
      - approval_request
  kanye:
    role: "Creative generation and local media artifact owner."
    allowed_toolboxes:
      - creative-generation
      - image-edit
      - video-generation
      - higgsfield-ai-official-skill
      - reference-media-read
      - filesystem-media-artifacts
    forbidden_direct_tools:
      - campaign-mutation
      - ad-publication
      - paid-delivery-mutation
      - identity-private-media-use-without-approval
    outputs_owned:
      - generated_media
      - media_manifest
      - attachment_provenance
      - generation_caveats
  jack:
    role: "Governance and approval boundary only unless explicitly asked to supervise."
    outputs_owned:
      - approval_packet
      - route_decision
      - final_operator_render

canonical_inputs:
  brand_scope:
    required_fields: [brand_id, store_key, canonical_domain]
    priority_brands: [maybe-paris, blinx, botanic]
  campaign_objective:
    required_fields: [objective, funnel_stage, target_audience, success_metric]
  budget_scope:
    required_fields: [spend_delta, platform, guardrails]
    approval_required: true
  product_or_offer:
    required_fields: [product_focus, offer_context, claims_allowed, claims_forbidden]
  source_assets:
    required_fields: [local_path, sha256, role, sensitivity]
  generated_asset:
    required_fields: [local_path, sha256, dimensions, manifest_path, usage_allowed]

